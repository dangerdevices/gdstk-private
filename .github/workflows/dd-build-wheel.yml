name: DD Build Wheels

on:
  release:
      types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    runs-on: [ubuntu-latest]
    name: Build wheels
    steps:
      - uses: actions/checkout@v3
      - run: |
          set -x
          docker run quay.io/pypa/manylinux2014_x86_64 -v $(pwd):/gdstk 'cd /gdstk ; python3.11 -m pip wheel .'
      - uses: actions/upload-artifact@v3
        with:
          path: ./gdstk*.whl
