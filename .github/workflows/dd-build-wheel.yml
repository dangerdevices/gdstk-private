name: DD Build Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2014_x86_64
      volumes:
        - "${{github.workspace}}:/gdstk"
    steps:
      - name: Build wheel
        run: cd /gdstk; python3.11 -m pip wheel .
