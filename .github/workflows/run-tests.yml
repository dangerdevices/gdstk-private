name: Tests Runner

on:
  push

jobs:
  linux-macos-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13']
    name: Test for ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libqhull-dev
      - name: Install dependencies (MacOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install qhull
      - name: Install python dependencies
        run: |
          uv sync --locked
      - name: Test
        run: |
          uv run pytest --locked
