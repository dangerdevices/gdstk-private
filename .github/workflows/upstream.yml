name: Fetch Upstream
on:
  schedule:
  - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  heitzmann:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        ref: master
        token: ${{ secrets.DD_GITHUB_REPO_TOKEN }}
    - run: |
        git remote add upstream https://github.com/heitzmann/gdstk.git
        git fetch upstream
        git merge --ff-only upstream/master
        git push

  dangerdevices:
    needs: heitzmann
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        ref: dangerdevices
        token: ${{ secrets.DD_GITHUB_REPO_TOKEN }}
    - env:
        GITHUB_TOKEN: ${{ secrets.DD_GITHUB_REPO_TOKEN }}
    - run: |
        current=$(git rev-parse HEAD)

        conflicts=false
        branch="from-master-$(date +%s)"
        git switch -c "${branch}"
        git merge origin/master || {
          # merge conflicts \o/
          conflicts=true
          git ls-files --unmerged | while read -r conflict; do
            git add "${conflict}"
            git commit --quiet --no-edit
          done
        }

        [[ "${current}" == $(git rev-parse HEAD) ]] && {
          echo "up to date! nothing to do..."
          exit
        }
        git push -u "${branch}"

        body=$(mktemp)
        [[ "${conflicts}" == true ]] && {
          echo -e ":cry:, unfortunately, there were merge conflicts..." >"${body}"
        }
        cat .dd/upstream-dangerdevices.md" >>"${body}"

        gh pr create \
          --title 'Merge latest `master` into `dangerdevices`' \
          --body-file "${body}" \
          --head "${branch}" \
          --base dangerdevices
