name: Fetch Upstream
on:
  schedule:
  - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  heitzmann:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        ref: master
        token: ${{ secrets.DD_GITHUB_REPO_TOKEN }}
    - run: |
        git remote add upstream https://github.com/heitzmann/gdstk.git
        git fetch upstream
        git merge --ff-only upstream/master
        git push

  dangerdevices:
    needs: heitzmann
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.DD_GITHUB_REPO_TOKEN }}
    - env:
        GITHUB_TOKEN: ${{ secrets.DD_GITHUB_REPO_TOKEN }}
      run: |
        [[ -z "$(git rev-list master ^origin/dangerdevices)" ]] && {
          echo "up to date! nothing to do..."
          exit
        }

        branch="from-master-$(date +%s)"
        git switch -c "${branch}"
        gh pr create \
          --title 'Merge latest `master` into `dangerdevices`' \
          --body-file "$(pwd)/.dd/upstream-dangerdevices.md" \
          --head "${branch}" \
          --base dangerdevices
