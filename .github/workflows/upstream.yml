name: Fetch Upstream
on:
  schedule:
  - cron: '*/15 * * * *'
jobs:
  heitzmann:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        ref: master
        token: ${{ secrets.DD_GITHUB_REPO_TOKEN }}
    - run: |
        git remote add upstream https://github.com/heitzmann/gdstk.git
        git fetch upstream
        git merge --ff-only upstream/master
        git push
