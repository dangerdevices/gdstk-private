name: Tests Runner

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.7", "3.11"]
    name: Test for ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install pip-tools pytest
          python -m piptools compile --resolver=backtracking -o requirements.txt pyproject.toml
          pip install -r requirements.txt
      - name: Build and install
        run: pip install .
      - name: Test
        run: pytest

  windows-test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.11"]
    defaults:
      run:
        shell: pwsh
    name: Test for ${{ matrix.python-version }} on windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
      - name: Install dependencies
        run: conda install cmake zlib numpy pytest
      - name: Build
        run: pip install .
      - name: Test
        run: pytest
  macos-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.10"]
    name: MacOS test for ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install build dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pip-tools pytest ninja conan==1.60
          python -m piptools compile --resolver=backtracking -o requirements.txt pyproject.toml
          pip install -r requirements.txt
      - name: Build and install
        run: pip install .
      - name: Test
        run: pytest
